# TRANSPE — nginx origin for CloudFront.
# transpe.net DNS -> CloudFront (TLS terminated at the edge). CloudFront's
# origin is this EC2 box, which serves plain HTTP on :80 and proxies to the
# Next.js app on 127.0.0.1:3000. TRUSTED_PROXY_HOPS=2 in .env accounts for the
# CloudFront + nginx hops when deriving the real client IP.
#
# Install:
#   sudo cp deploy/nginx-TRANSPE.conf /etc/nginx/sites-available/TRANSPE
#   sudo ln -sf /etc/nginx/sites-available/TRANSPE /etc/nginx/sites-enabled/TRANSPE
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name transpe.net www.transpe.net _;

    # Security headers (CloudFront may add its own; these are origin-side).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # KYC document uploads.
    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Next.js static assets — long immutable cache.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check (no access log noise).
    location /api/healthz {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
